  - id: pixelfx
    name: PixelFX
    category: game-development
    source:
      repository: https://github.com/patch-gg/pixelfx
      docs: https://patch-gg.github.io/pixelfx/
    license: MIT
    required: false
    versionConstraint: "pinned:5294518 (main, 2026-11-12; package.json 0.3.1; no tags or releases)"
    verifiedVersion: "5294518 (installed at $HOME/tools/pixelfx 2026-11-21; list.mjs and render.mjs --sheet run from outside the checkout; not tested in a game)"
    install:
      strategy: skill-pack
      reference: https://github.com/patch-gg/pixelfx#the-skill
    integrationStatus: integrated   # Board 2026-11-21: reviewed, approved, installed at $HOME/tools/pixelfx (commit 5294518; docs/operations/installation.md)
    usedBy: [game-artist]   # gameplay-programmer imports the exported sheets; it does not use the tool
    compatibility: "Production-time art/VFX source library plus a Claude Code skill (plugin marketplace patch-gg/pixelfx, or skills/pixelfx). Not a shipped dependency of any game: only selected effects are exported as sprite sheets (`node tools/render.mjs <category>/<name> --sheet`: transparent PNG grid plus Aseprite-style JSON with frame rects, durations, fps, loop and pivot) and then go through the project's own asset workflow (knowledge/departments/game/workflows/asset-production.md). Needs Node >= 18. Install (Board, R4): `git clone https://github.com/patch-gg/pixelfx \"$HOME/tools/pixelfx\"`, then `git -C \"$HOME/tools/pixelfx\" checkout 5294518`; no npm install (esbuild is only for the gallery). Keep it outside every agent workspace so agents cannot add effect files. game-artist's allowlist allows only `node ~/tools/pixelfx/tools/list.mjs` and `node ~/tools/pixelfx/tools/render.mjs`. The upstream skill is NOT installed for agents."
    notes: "Security review 2026-11-21 at commit 5294518 (security-architecture.md section 11.1): official repository patch-gg/pixelfx (not a fork, MIT); no install scripts; one devDependency (esbuild, gallery build only); the Claude plugin is one skill (skills/pixelfx/SKILL.md), no hooks, commands or MCP servers; render.mjs and list.mjs use only node:fs, node:path, node:zlib and node:url, read no environment variables and make no network calls; render.mjs imports only effect files that exist under src/fx (resolveIds filters by the file tree), writes PNG and JSON under --out, and calls ffmpeg only for --gif/--mp4; tools/serve.mjs opens a local HTTP server and is not allowlisted. Sheets use the effect alone, without the stand-in character. Advisories: none checked beyond the dependency list. Not tested in any game. The studio machine also has the upstream plugin installed at user scope (0.3.0, commit a841596, not reviewed), which claude_local agents may load (UNVERIFIED). 244 effects in 21 categories. NOTICE.md: some effects and src/core/sim.js adapt Sprite Fusion's MIT effects (Hugo Duprez) and src/core/act.js adapts Hollow Crown (MIT), so keep those notices with exported work; the Patch Pixel font in gallery/fonts is NOT under MIT and is excluded. Lamplight Vigil allows only original or CC0 assets, so its output cannot be used there without a Board change to that rule. Risks: fit with each project's art references, frame size, pivot, fps, palette, transparency, upstream changes; never bulk-import the library."

