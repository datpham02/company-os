  - id: ui-ux-pro-max-skill
    name: UI/UX Pro Max Skill
    category: web-design
    source:
      repository: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill
    license: MIT
    required: false
    versionConstraint: "pin to a release tag when adopted (v2.15.0 seen)"
    verifiedVersion: "2.15.0 core skill only (sha512-D0J/C40x...3urw==), copied to ~/.claude/skills/ui-ux-pro-max by the Board, 2026-11-04"
    install:
      strategy: skill-pack
      reference: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill#readme
    integrationStatus: integrated
    usedBy: [ui-designer, web-engineer]
    compatibility: "Claude Code plugin (`/plugin marketplace add nextlevelbuilder/ui-ux-pro-max-skill`) or npm CLI `ui-ux-pro-max-cli` (`uipro init --ai claude` or `--ai codex`). Its search script needs Python 3."
    notes: "Security review: 2026-11-04, npm 2.15.0, approved with conditions (GAM-35). Install ONLY the core skill: the 6 bundled skills read ~/.claude/.env and call third-party APIs or run npx shadcn add. Do not use the plugin route (tracks main), uipro update/uninstall, or the stack/ scaffold (Read(//home/**)). SKILL.md script paths changed to python \"$HOME/.claude/skills/...\". Allowlist for ui-designer: Bash(python \"$HOME/.claude/skills/ui-ux-pro-max/scripts/search.py\"*). Chosen over taste-skill by the Board rule: prefer the most-starred overlapping tool."

