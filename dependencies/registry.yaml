  - id: rea
    name: REA (Reverse Engineer Anything)
    category: development-tools
    source:
      repository: https://github.com/morluto/rea
      docs: https://rea.tools
      package: npm:rea-agents
    license: MIT
    required: false
    versionConstraint: "pinned:6.10.1 when adopted (release rea-agents-6.10.1, 2026-11-20; upstream mcp.json pins the same version)"
    verifiedVersion: "not installed for agents. Checked from GitHub on 2026-11-21: main bf77776, package.json 6.10.1, MIT, not a fork, not archived"
    install:
      strategy: mcp-server
      reference: https://github.com/morluto/rea/blob/main/docs/getting-started/installation.md
    integrationStatus: candidate
    usedBy: [gameplay-programmer]   # intended: technical reference while coding games, only when a Task asks for it
    compatibility: "MCP server (`npx -y rea-agents@6.10.1 mcp`) plus a CLI (`rea`) and Claude Code, Codex and Cursor plugins. Needs Node.js ^22.23.4, ^24.22.1 or >=26.12.1 (package.json engines). Native binaries need Hopper, Ghidra, IDA or Kuna; Unity IL2CPP metadata, Godot PCK, JavaScript/Electron and WebAssembly are analysed with built-in static decoders. Runs locally (README FAQ), but every tool result goes into the agent's context and so to the model provider."
    notes: "Intended use (Board request 2026-11-21): when a Task explicitly asks for it, decompile or inspect a game build to learn how a technique works, as a reference while coding our own games. Conditions to settle in the evaluation: (1) targets limited to the studio's own builds, open-source games, or software the Board has confirmed we may analyse, named in the Task; (2) findings recorded as a written description of the technique, never as copied code, assets or data, and nothing from a target goes into a game repository (upstream DISCLAIMER.md also excludes copying proprietary code or assets, bypassing DRM, licence checks or anti-cheat, and cheats); (3) no runtime instrumentation (Frida, gdb, ADB) or browser capture without a separate Board decision; (4) the Board checks the local law and the target's licence or EULA on reverse engineering. Security review not done: `npx rea-agents setup` registers REA with the agent and installs workflow instructions, so review what it writes before any install; package.json has a `prepare` script (runs only in a source checkout, to confirm) and 43 runtime dependencies. The Board's own Claude Code on the studio machine already has a REA MCP server and the reverse-engineer-anything skill at user scope (not reviewed), which claude_local agents may load (UNVERIFIED)."

