  - id: impeccable
    name: Impeccable
    category: web-design
    source:
      repository: https://github.com/pbakaus/impeccable
      docs: https://impeccable.style
    license: Apache-2.0
    required: false
    versionConstraint: "pin to a release tag when adopted (cli-v4.8.0 seen)"
    verifiedVersion: null
