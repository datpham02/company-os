  - id: rea
    name: REA (Reverse Engineer Anything)
    category: development-tools
    source:
      repository: https://github.com/morluto/rea
      docs: https://rea.tools
      package: npm:rea-agents
    license: MIT
    required: false
    versionConstraint: "pinned:6.10.1 (tag rea-agents-6.10.1 = commit 8bb01b5, npm 2026-11-20)"
    verifiedVersion: "6.10.1 reviewed from source and npm metadata on 2026-11-21 (sha512-3AWrfFEX...4SNyg==); not installed for agents, not trial-run"
    install:
      strategy: mcp-server
      reference: https://github.com/morluto/rea/blob/main/docs/getting-started/installation.md
    integrationStatus: approved   # Board 2026-11-21: approved with the conditions in notes; not installed (Cursor MCP scope open, OQ-046)
    usedBy: [gameplay-programmer]   # intended: technical reference while coding games, only when a Task asks for it
    compatibility: "MCP server (stdio) plus a CLI (`rea`) and Claude Code, Codex and Cursor plugins. Needs Node.js ^22.23.4, ^24.22.1 or >=26.12.1. Native binaries need Hopper, Ghidra, IDA or Kuna (none installed; Hopper is unsupported on Windows); Unity IL2CPP metadata, Godot PCK, .NET, JavaScript/Electron and WebAssembly use built-in static decoders. Analysis is local, but every tool result goes into the agent's context and so to the model provider. Integration gap: gameplay-programmer runs on cursor-cli, so its MCP config is the user-wide `~/.cursor/mcp.json`, which web-engineer shares; the Board must decide how to scope it before install. Recommended setup if approved: `npm install -g rea-agents@6.10.1 --omit=optional` (skips Frida and its install script), then `rea setup --client <client> --no-skill --dry-run --json`, review, and rerun with `--yes` (never `--all-detected`, never interactive setup, which pre-selects a Hopper install); set `REA_MCP_TOOL_FAMILIES=direct,artifact,managed,native` so the process, debugger, Frida, ADB, browser and Electron tools are hidden; keep the HTTP MCP transport off."
    notes: "Intended use (Board request 2026-11-21): when a Task explicitly asks for it, inspect a game build to learn how a technique works, as a reference while coding our own games. BOARD DECISION 2026-11-21: approved with these conditions, all binding: (1) targets limited to the studio's own builds, open-source games, or software the Board has confirmed we may analyse, named in the Task; (2) findings recorded as a written description of the technique, never as copied code, assets or data, and nothing from a target goes into a game repository (upstream DISCLAIMER.md also excludes copying proprietary code or assets, bypassing DRM, licence checks or anti-cheat, and cheats); (3) static analysis only: no runtime instrumentation or capture without a separate Board decision; (4) the Board checks the local law and the target's licence or EULA. (5) installed only as recommended in `compatibility` (pinned 6.10.1, `--omit=optional`, `--no-skill`, static tool families, stdio only); (6) not installed for any agent until the Cursor MCP scope is decided (OQ-046). SECURITY REVIEW 2026-11-21 at commit 8bb01b5 / npm 6.10.1 (security-architecture.md section 11.1), verdict: nothing malicious or deceptive; risky but legitimate options, handled by the recommended setup. Origin: official repository morluto/rea (not a fork, MIT, active, 3 committers); npm `rea-agents` repository field matches; published by GitHub Actions OIDC with SLSA provenance; the npm name `rea` is an unrelated older package (stagas/rea), do not confuse them. Install path: no preinstall/install/postinstall of its own (`prepare` runs only from a git checkout); the only production dependency with an install script is the optional `frida` 17.23.2 (omit it). `rea setup` shows its plan first, backs up each config to `<file>.rea.backup` and rolls back on failure; it writes only the MCP entry (command, args, env; no auto-approve fields) to ~/.claude.json, ~/.codex/config.toml or ~/.cursor/mcp.json, plus the skill to ~/.claude/skills or ~/.agents/skills; it touches no permission allowlists, hooks, CLAUDE.md/AGENTS.md or shell profiles. Agent-facing text: SKILL.md (675 lines) and plugin.json read in full: no prompt injection, no instruction to read secrets or send data out, no permission bypass; it tells the agent to fall back to `npx -y rea-agents@latest`, which breaks pinning, so install with `--no-skill`. The Claude Code plugin declares skills and one MCP server through a launcher that refuses any version but 6.10.1; no hooks, commands or agents. Runtime: no telemetry, accounts or API keys; the CLI checks registry.npmjs.org for updates at most daily only in an interactive terminal (never as the MCP server; NO_UPDATE_NOTIFIER disables it); Hopper downloads (hopperapp.com, PGP-checked) only through setup with approval; browser/Electron tools contact the URLs they are given; the MCP tools have no approval step of their own, so the tool-family limit and client permissions are the control. Advisories: none for rea-agents (GitHub, OSV); among 174 production packages OSV lists only minimatch 10.2.5 (GHSA-g3hv-75wg-m249, moderate ReDoS) pulled in by the optional frida. Not done: trial run, line-by-line audit of all tools (targeted review). Existing machine state: the Board's own Claude Code has a REA MCP server (`npx -y rea-agents@6.7.0 mcp`, unreviewed version) and the reverse-engineer-anything skill (since 2026-10-24) at user scope. Soucean claude_local runs list only Paperclip's MCP servers (latest init 2026-11-05) and no rea tool appears in their logs, so agents do not get that MCP server; whether they see the user-scope skill is not shown in the logs (UNVERIFIED)."
