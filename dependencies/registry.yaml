      strategy: skill-pack
      reference: https://github.com/pbakaus/impeccable#readme
    integrationStatus: rejected
    usedBy: [ui-designer, web-engineer]
    compatibility: "`npx impeccable install`, then `/impeccable init` (Claude Code) or `$impeccable init` (Codex). The installer also adds agent hooks."
