  - id: comfyui
    name: ComfyUI (Windows portable build)
    category: game-development
    source:
      repository: https://github.com/Comfy-Org/ComfyUI   # origin of the installed checkout (comfyanonymous/ComfyUI redirects here)
      docs: https://docs.comfy.org/
    license: GPL-3.0   # LICENSE file of the installed copy
    required: false
    versionConstraint: "pinned:v0.46.0 (commit a277b5bf213e8a44fa34817b7770b54f86ef4cea); update only through the Board, as a new review of the diff"
    verifiedVersion: "v0.46.0, commit a277b5bf213e8a44fa34817b7770b54f86ef4cea (2026-11-18), clean checkout (git status empty), Windows portable build with CUDA 12.6 at $HOME/game-studio-workspace/tools/ComfyUI_windows_portable (read 2026-11-22). Embedded Python stack: see comfyui-embedded-python. No third-party custom nodes (custom_nodes holds only the two upstream-tracked files example_node.py.example and websocket_image_save.py)"
    install:
      strategy: external-service
      reference: "Official Windows portable release, https://github.com/Comfy-Org/ComfyUI/releases (README section 'Windows Portable'); installed by the Board; operations: docs/operations/runtime-management.md#10-comfyui-draft-script-and-art-ops-d1-2026-11-22"
    integrationStatus: integrated   # Board decision D1 2026-11-22: installed and used through comfy-draft.py and art-ops.py
    usedBy: [game-artist]
    compatibility: "Local image generation server, started by runtime/tools/comfy-draft.py on 127.0.0.1:8188 with --offline (no frontend internet access, partner/API nodes disabled) and --disable-auto-launch. Agents never call it directly: game-artist runs only the installed copies of comfy-draft.py (text-to-image, the two approved checkpoints, no input images) and art-ops.py, by exact allowlist rules (security-architecture.md section 4). Outputs go to ~/game-studio-workspace/staging/art/<asset_id>/."
    notes: "security review: 2026-11-22, v0.46.0 (a277b5b), passed with one hardening (comfy-draft.py now adds --offline), performed by Claude Code for the Board, accepted by the Board 2026-11-22 (PR #88, Board answer: 'Accept; you merge #88'). Covered (security-architecture.md 11.1): (1) origin: official Comfy-Org repository, not a fork, checkout clean at the tag; (2) install path: portable archive, no installer; run_nvidia_gpu.bat starts main.py only; update/update.py and the update .bat files do git pull and pip install and are run by the Board only, never by agents; (3) agent-facing text: the bundled AGENTS.md (404 lines, upstream contributor style guide) read in full: no instructions to read secrets, send data, disable permissions or install anything; it forbids outbound internet requests in core; no SKILL.md, hooks, MCP config or plugins; (4) runtime: loopback only; without --offline the web frontend may reach the internet and partner (paid cloud API) nodes are available, hence --offline; no account, API key or telemetry configured; ComfyUI-Manager not enabled; (5) health: active official organisation; 4 published GitHub Security Advisories (GHSA-rj8c-c4p8-3c5h, GHSA-53g8-45wq-pcv8, GHSA-rvxv-29p8-pxgq, GHSA-pj59-g5vv-74q4: XSS and path traversal) all fixed in 0.28.0, so not applicable to 0.46.0; the LoadImage path-traversal advisory matters for any future image-input workflow; (6) trial: text-to-image smoke runs with both checkpoints at release gate G7. Its GPL-3.0 covers the ComfyUI software, not generated images: an output's licence follows the checkpoint and the project's own licensing rule. A third-party custom node runs arbitrary code in the ComfyUI process and needs its own review and Board approval. Model downloads and updates are Board actions; agents install nothing. Integrity: check-dependencies.py has no version command for this entry and reports it as skipped, which is not a runtime integrity check; the pin is the commit, checked at release gate G4 (git -C <ComfyUI> rev-parse HEAD and git status)."

